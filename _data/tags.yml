# Erlaubte Stichwörter (Tags) für Rezepte, klein geschrieben. Nur, was die Kategorie nicht schon sagt:
# Hauptzutaten (Hähnchen, Rind, Hackfleisch, Schwein, Ente, Fisch), „Amerikanisch“, „Wochenendprojekt“ usw. sind Kategorien
# (_data/categories.yml). „vegetarisch“ nur, wenn die Kategorie „Vegetarisch“ nicht passt (Süßes, Brot).
# Das Formular unter /neues-rezept/ bietet diese Liste zum Antippen an.
hauptzutat: ["vegetarisch", "vegan"]
kueche: ["französisch", "deutsch", "österreichisch", "englisch", "ungarisch", "griechisch", "türkisch", "koreanisch", "thailändisch", "chinesisch", "karibisch"]
eigenschaft: ["scharf", "high-protein", "low-carb", "ofen", "one-pot", "pfanne", "streetfood", "klassiker", "familientauglich", "am-vortag-starten"]
