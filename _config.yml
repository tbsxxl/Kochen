title: "Tobis Kochbuch"
description: "Online-Kochbuch"

# Gehostet auf Cloudflare Workers (Static Assets) im Root der Domain.
baseurl: ""
url: "https://kochbuch.tobis.workers.dev"

# Hochzählen, wenn Rezeptbilder geändert werden, damit Browser sie neu laden.
image_version: 3

markdown: kramdown
encoding: utf-8

collections:
  recipes:
    output: true
    permalink: /rezepte/:name/

defaults:
  - scope:
      path: ""
      type: recipes
    values:
      layout: recipe

include:
  - _headers

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - wrangler.jsonc
  - README.md
  - CLAUDE.md
  - tools
  - MaybeRezepte
  - recipes/images/README.txt
